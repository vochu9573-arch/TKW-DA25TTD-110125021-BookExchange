<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Tài Liệu — CTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #2D3748;
            --accent-color: #3182CE;
            --bg-light: #F7FAFC;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-color);
            padding-top: 80px;
        }
        .custom-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #E2E8F0;
        }
        .info-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            max-width: 650px;
            margin: 0 auto;
        }
        .meta-label {
            color: #718096;
            font-weight: 500;
        }
        .meta-value {
            font-weight: 600;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <nav class="navbar custom-nav fixed-top">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold fs-3 text-dark" style="letter-spacing: -1px;">ctp.</a>
            <div class="d-flex align-items-center gap-3">
                <a href="#" onclick="history.back(); return false;" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-arrow-left"></i> Quay lại</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card info-card p-4 p-md-5 shadow-sm">
            
            <div class="text-center mb-4">
                <div class="display-4 text-danger mb-2">
                    <i class="bi bi-file-earmark-pdf"></i>
                </div>
                <h3 class="fw-bold text-dark lh-base">Tên giáo trình</h3>
                <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1 mt-2" style="font-size: 12px;">Đại học — Đại cương</span>
            </div>

            <div class="mb-4 bg-light p-3 rounded-3">
                <h6 class="fw-bold mb-2">Mô tả tài liệu:</h6>
                <p class="text-secondary small mb-0 lh-lg">
                   nội dung tóm tắt
                </p>
            </div>

            <div class="row g-3 mb-4 border-top pt-3">
                <div class="col-6">
                    <span class="meta-label d-block small">Định dạng</span>
                    <span class="meta-value">PDF (.pdf)</span>
                </div>
                <div class="col-6 text-end">
                    <span class="meta-label d-block small">Dung lượng</span>
                    <span class="meta-value">n MB</span>
                </div>
                <div class="col-6">
                    <span class="meta-label d-block small">Người đăng</span>
                    <span class="meta-value">tên người đăng</span>
                </div>
                <div class="col-6 text-end">
                    <span class="meta-label d-block small">Lượt tải</span>
                    <span class="meta-value">số lượt tải</span>
                </div>
            </div>

            <div class="d-grid gap-2">
    <button type="button" class="btn btn-dark rounded-pill py-2.5 fw-semibold" onclick="window.location.href='upload.html'">
        <i class="bi bi-download me-2"></i> Tải xuống tài liệu
    </button>
</div>

        </div>
    </div>

    <footer class="py-4 mt-5">
        <div class="container text-center text-muted small">
            <p class="mb-0"></p>
        </div>
    </footer>

</body>
</html>
